[project]
name = "lineagepilot-spike-dag"
version = "0.0.1"
description = "LineagePilot Phase 0 spike S3: static (AST-only) Airflow DAG analysis for dbt task-to-model links."
requires-python = ">=3.10"
# Runtime is stdlib-only by design: DAG files are untrusted workspace input.
dependencies = []

[project.scripts]
lineagepilot-spike-dag = "lineagepilot_spike_dag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
# Used only to validate the selector engine against real `dbt ls` on fixture projects written for this spike.
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagepilot_spike_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lineagepilot_spike_dag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
