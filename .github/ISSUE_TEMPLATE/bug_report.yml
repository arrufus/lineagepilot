name: Bug report
description: Something in LineagePilot does not work as it should.
title: "[bug] "
labels: ["beta", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. The output and the trace can contain model names, paths and SQL from your project: read them, and remove anything you cannot share, before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, and the smallest project or file that shows it, if you can share one.
  - type: input
    id: version
    attributes:
      label: LineagePilot version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and version
      description: Help › About. Say if it is Cursor, Windsurf or VSCodium.
      placeholder: "VS Code 1.144.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: LineagePilot › Show Status shows the one the language server runs on.
  - type: input
    id: dbt
    attributes:
      label: dbt version and adapter
      placeholder: "dbt-core 1.10, dbt-snowflake"
  - type: dropdown
    id: trust
    attributes:
      label: Was the workspace trusted?
      options: ["Trusted", "Restricted Mode", "Not sure"]
  - type: textarea
    id: output
    attributes:
      label: Output
      description: From LineagePilot › Show Output. For a problem with a request, set lineagePilot.trace.server to messages first, then make it happen again.
      render: text
