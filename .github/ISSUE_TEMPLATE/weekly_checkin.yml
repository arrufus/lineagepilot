name: Weekly beta check-in
description: Once a week, one per team. How the review was used, and whether it changed anything.
title: "[check-in] <team>, week of <YYYY-MM-DD>"
labels: ["beta", "beta-checkin"]
body:
  - type: markdown
    attributes:
      value: |
        This takes about three minutes. At the end of the four-week beta, these answers decide whether LineagePilot carries on, changes direction or stops (docs/beta.md). Short answers and "none" are useful answers.
  - type: input
    id: team
    attributes:
      label: Team
    validations:
      required: true
  - type: input
    id: week
    attributes:
      label: Week
      description: The Monday the week started.
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: active
    attributes:
      label: How many people in your team used LineagePilot this week?
      description: Anyone who had a dbt project open with it running.
    validations:
      required: true
  - type: input
    id: reviewed
    attributes:
      label: How many of them opened the Change Impact Review at least once this week?
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Usage counts (optional)
      description: If people turned usage counts on, paste what LineagePilot › Copy Usage Counts gives, one table per person. They hold three numbers a week and nothing about your projects.
  - type: textarea
    id: pull-requests
    attributes:
      label: Pull requests a review was pasted into this week
      description: Links, or "none". A link to a private repository is enough. We do not need to open it.
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Did a review change a decision this week?
      description: For example, a change held back, a column kept, an owner told first, or a DAG fixed before merging.
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: decision-detail
    attributes:
      label: If it did, what did the review show, and what did you do differently?
  - type: textarea
    id: wrong
    attributes:
      label: Did the review miss something, or list something wrong?
  - type: textarea
    id: other
    attributes:
      label: Anything else
