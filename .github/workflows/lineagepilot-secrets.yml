# Secret scan (design section 10, security audit H1): gitleaks over the whole git history, every
# branch and tag, on every push and pull request. The release workflow runs it on the tagged
# commit too, so nothing is released from a history that holds a secret.
#
# gitleaks runs from its release binary, checked against the SHA-256 pinned below: no third-party
# action and no licence key. Its allowlist is .gitleaks.toml at the repository root, where each
# entry says why it is not a secret. Findings are printed redacted.
name: lineagepilot-secrets

on:
  workflow_dispatch:
  # The release workflow runs this on the tagged commit
  workflow_call:
  push:
    # Branches only: a release tag runs this through lineagepilot-release.yml instead
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # gitleaks v8.30.1, released 21 March 2026. The SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from
  # the release's gitleaks_8.30.1_checksums.txt and the same as GitHub's digest for the asset.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, every branch and tag: a secret removed in a later commit is still leaked
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its pinned SHA-256
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # gitleaks reads .gitleaks.toml from the repository root, and runs
      # `git log -p --all --full-history`: every commit reachable from any ref.
      - name: Scan the whole history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --verbose --exit-code 1 \
            --config .gitleaks.toml .
