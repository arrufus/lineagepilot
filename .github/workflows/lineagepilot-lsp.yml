# lineagepilot_lsp (Phase 2): the language server's unit and end-to-end tests over stdio, with
# the coverage gate, on Linux, macOS and Windows with Python 3.10 and 3.13, plus lint and a
# dependency audit. The server depends on packages/core, so changes there run this too.
name: lineagepilot-lsp

on:
  workflow_dispatch:
    inputs:
      pytest-args:
        description: "Extra pytest arguments, for example -v -x -k test_name"
        required: false
        default: ""
  push:
    paths:
      - "packages/lsp/**"
      - "packages/core/**"
      - "fixtures/**"
      - "protocol/**"
      - ".github/workflows/lineagepilot-lsp.yml"
  pull_request:
    paths:
      - "packages/lsp/**"
      - "packages/core/**"
      - "fixtures/**"
      - "protocol/**"
      - ".github/workflows/lineagepilot-lsp.yml"

permissions:
  contents: read

env:
  # The version that wrote uv.lock, so `--locked` compares like with like.
  UV_VERSION: "0.7.6"

defaults:
  run:
    shell: bash
    working-directory: packages/lsp

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the default six hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python ${{ matrix.python }}
      # The end-to-end tests start the server, which starts its indexer; coverage follows both.
      - if: runner.os != 'Windows'
        run: uv run --locked pytest $PYTEST_ARGS
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
      # On Windows the job hung (2 November 2026), and a job that reaches its time limit keeps
      # no log. The suite runs there in two steps with their own limits, which keep the log,
      # then lists the Python processes still running. The coverage gate holds elsewhere.
      # The extension workflow also runs the end-to-end tests on Windows, against the
      # VSIX's bundled server on a plain interpreter, and they pass there.
      - if: runner.os == 'Windows'
        name: Unit tests (Windows)
        timeout-minutes: 6
        run: >-
          uv run --locked pytest --no-cov -v -p no:cacheprovider tests/test_indexing_units.py
          tests/test_context_locate.py tests/test_features_units.py tests/test_protocol.py
      - if: runner.os == 'Windows'
        name: End-to-end tests (Windows)
        timeout-minutes: 8
        run: >-
          uv run --locked pytest --no-cov -v -p no:cacheprovider tests/test_indexing_e2e.py
          tests/test_methods_e2e.py tests/test_features_e2e.py
      - if: always() && runner.os == 'Windows'
        name: Python processes still running
        run: tasklist //FI "IMAGENAME eq python.exe" //V || true

  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # The zod and Python validators must match protocol/lineage-protocol.schema.json
      - run: uv run --locked python ../../protocol/generate.py --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # Runtime and dev dependencies, exactly as locked, with their hashes. The core is a
      # local path, audited by its own workflow.
      - run: |
          mkdir -p work
          uv export --frozen --no-emit-project --no-emit-package lineagepilot-core \
            --no-group audit --format requirements-txt -o work/audit-requirements.txt
          uv run --locked --only-group audit pip-audit --strict --require-hashes --disable-pip \
            -r work/audit-requirements.txt
