# lineagepilot_lsp (Phase 2): the language server's unit and end-to-end tests over stdio, with
# the coverage gate, on Linux and macOS with Python 3.10 and 3.13 (Windows: see the matrix),
# plus lint and a dependency audit. The server depends on packages/core, so changes there
# run this too.
name: lineagepilot-lsp

on:
  workflow_dispatch:
    inputs:
      pytest-args:
        description: "Extra pytest arguments, for example -v -x -k test_name"
        required: false
        default: ""
  push:
    paths:
      - "packages/lsp/**"
      - "packages/core/**"
      - "fixtures/**"
      - "protocol/**"
      - ".github/workflows/lineagepilot-lsp.yml"
  pull_request:
    paths:
      - "packages/lsp/**"
      - "packages/core/**"
      - "fixtures/**"
      - "protocol/**"
      - ".github/workflows/lineagepilot-lsp.yml"

permissions:
  contents: read

env:
  # The version that wrote uv.lock, so `--locked` compares like with like.
  UV_VERSION: "0.7.6"

defaults:
  run:
    shell: bash
    working-directory: packages/lsp

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is tested by the lineagepilot-extension workflow, which runs these
        # end-to-end tests against the VSIX's bundled server. Here the unit tests hang on
        # Windows CI and GitHub cannot stop them (LP-7t7).
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the default six hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python ${{ matrix.python }}
      # The end-to-end tests start the server, which starts its indexer; coverage follows both.
      - run: uv run --locked pytest $PYTEST_ARGS
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}

  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # The zod and Python validators must match protocol/lineage-protocol.schema.json
      - run: uv run --locked python ../../protocol/generate.py --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # Runtime and dev dependencies, exactly as locked, with their hashes. The core is a
      # local path, audited by its own workflow.
      - run: |
          mkdir -p work
          uv export --frozen --no-emit-project --no-emit-package lineagepilot-core \
            --no-group audit --format requirements-txt -o work/audit-requirements.txt
          uv run --locked --only-group audit pip-audit --strict --require-hashes --disable-pip \
            -r work/audit-requirements.txt
