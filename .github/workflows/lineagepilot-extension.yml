# The VS Code extension (Phases 2 and 3): build one universal VSIX on Linux, then on Linux, macOS
# and Windows with Python 3.10 and 3.13 run the language server's end-to-end tests against the
# VSIX's bundled server and the @vscode/test-cli integration tests against the packaged
# extension, trusted and in Restricted Mode. The build job runs the lineage view's React
# Testing Library tests with their 75% gate; a coverage job enforces the extension's.
name: lineagepilot-extension

on:
  workflow_dispatch:
  push:
    paths:
      - "extension/**"
      - "packages/**"
      - "protocol/**"
      - "fixtures/**"
      - ".github/workflows/lineagepilot-extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "packages/**"
      - "protocol/**"
      - "fixtures/**"
      - ".github/workflows/lineagepilot-extension.yml"

permissions:
  contents: read

env:
  VSCODE_VERSION: "1.144.0"
  UV_VERSION: "0.7.6"

defaults:
  run:
    shell: bash
    working-directory: extension

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Generated protocol code is current
        run: python ../protocol/generate.py --check
      - name: requirements.lock matches packages/lsp/uv.lock
        run: |
          mkdir -p work
          (cd ../packages/lsp && uv export --frozen --no-dev --no-group audit --no-emit-project \
            --no-emit-package lineagepilot-core --format requirements-txt --no-header \
            -o ../../extension/work/requirements.lock)
          diff -u requirements.lock work/requirements.lock
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/bundle_libs.py
      - run: npm run test:unit
      - name: Lineage view tests (React Testing Library, gate 75%)
        run: npm run test:webview-coverage
      - run: npm run package
      - run: python scripts/check_vsix.py dist/lineagepilot.vsix
      - name: Build script tests, including the real bundle and VSIX
        run: uv run --project ../packages/lsp --locked pytest --no-cov -p no:cacheprovider scripts/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-build
          path: |
            extension/dist/lineagepilot.vsix
            extension/bundled/libs
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # The same VSIX on every OS: nothing is rebuilt per platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-build
          path: extension
      - name: Unpack the VSIX
        run: |
          python -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
            dist/lineagepilot.vsix "$RUNNER_TEMP/vsix"
          echo "LP_EXTENSION_DIR=$RUNNER_TEMP/vsix/extension" >> "$GITHUB_ENV"
      # The interpreter has nothing installed, as for a user: the server runs on the bundle only.
      - name: Language server end-to-end tests on the bundled server
        working-directory: packages/lsp
        run: |
          uv sync --locked --python 3.13
          LP_TEST_SERVER="$LP_EXTENSION_DIR/bundled/tool/lsp_server.py" \
          LP_TEST_PYTHONS='${{ steps.py.outputs.python-path }}' \
            uv run --locked pytest --no-cov -p no:cacheprovider tests/test_indexing_e2e.py \
            tests/test_methods_e2e.py tests/test_features_e2e.py
      - run: npm ci
      - run: npm run compile-tests
      # Network only, so it may retry; the tests themselves never do.
      - name: Download VS Code
        run: |
          for attempt in 1 2 3; do
            node -e "require('@vscode/test-electron').downloadAndUnzipVSCode(process.env.VSCODE_VERSION).then(() => process.exit(0), (e) => { console.error(e); process.exit(1); })" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      - name: VS Code integration tests on the packaged extension
        env:
          LP_TEST_PYTHON: ${{ steps.py.outputs.python-path }}
          LP_VSCODE_VERSION: ${{ env.VSCODE_VERSION }}
        run: |
          run() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$@"; else "$@"; fi; }
          status=0
          for label in trusted restricted path python-extension; do
            echo "::group::$label"
            if ! LP_TEST_LOG="$RUNNER_TEMP/$label.log" run npx vscode-test --label "$label"; then
              echo "::error::integration tests failed: $label"
              cat "$RUNNER_TEMP/$label.log" || true
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: python scripts/bundle_libs.py
      # Unit and integration tests together in one VS Code, against the source build with its
      # source maps, so coverage maps back to src/*.ts.
      - name: Coverage (gate 75%)
        env:
          LP_TEST_PYTHON: ${{ steps.py.outputs.python-path }}
          LP_VSCODE_VERSION: ${{ env.VSCODE_VERSION }}
          LP_TEST_LOG: ${{ runner.temp }}/coverage.log
        run: xvfb-run -a npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extension-coverage
          path: extension/coverage
