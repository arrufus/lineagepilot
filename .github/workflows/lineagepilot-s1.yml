# Spike S1 (LineagePilot Phase 0): build one universal VSIX on Linux, then prove it starts the
# bundled pygls server and returns a CodeLens on Linux, macOS and Windows with Python 3.10 and 3.13.
name: lineagepilot-s1

on:
  workflow_dispatch:
  push:
    paths:
      - "lineagepilot/spikes/s1-packaging/**"
      - ".github/workflows/lineagepilot-s1.yml"
  pull_request:
    paths:
      - "lineagepilot/spikes/s1-packaging/**"
      - ".github/workflows/lineagepilot-s1.yml"

permissions:
  contents: read

env:
  VSCODE_VERSION: "1.144.0"

defaults:
  run:
    shell: bash
    working-directory: lineagepilot/spikes/s1-packaging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/bundle_libs.py
      - run: npm run package
      - run: python scripts/check_vsix.py dist/lineagepilot-spike.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s1-build
          path: |
            lineagepilot/spikes/s1-packaging/dist/lineagepilot-spike.vsix
            lineagepilot/spikes/s1-packaging/bundled/libs
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The same VSIX and bundle on every OS: nothing is rebuilt per platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s1-build
          path: lineagepilot/spikes/s1-packaging
      - run: npm ci
      - name: Extension unit tests
        run: npm run test:unit
      - name: Server tests over stdio
        run: |
          python -m pip install --quiet "pytest>=8" "pytest-lsp==1.0.1"
          LP_TEST_PYTHONS='${{ steps.py.outputs.python-path }}' python -m pytest -q -p no:cacheprovider
      # Network only, so it may retry; the tests themselves never do. The first run of this
      # workflow lost a job to a timeout resolving the "stable" version.
      - name: Download VS Code
        run: |
          for attempt in 1 2 3; do
            node -e "require('@vscode/test-electron').downloadAndUnzipVSCode(process.env.VSCODE_VERSION).then(() => process.exit(0), (e) => { console.error(e); process.exit(1); })" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      - name: VS Code integration tests on the packaged VSIX
        run: |
          npm run compile-tests
          run() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$@"; else "$@"; fi; }
          for source in setting path python-extension; do
            run node scripts/run_integration.mjs --python '${{ steps.py.outputs.python-path }}' \
              --source "$source" --vsix dist/lineagepilot-spike.vsix --vscode "$VSCODE_VERSION"
          done
