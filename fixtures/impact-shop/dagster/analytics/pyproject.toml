# The analytics team's Dagster project, laid out as `dg scaffold project` lays one out (task 8.9).
# Its one component, in src/shop_analytics/defs/marts/defs.yaml, makes the marts into assets.
# LineagePilot reads these files as text: nothing here is installed, imported or run.

[project]
name = "shop-analytics"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster==1.13.29",
    "dagster-dbt==0.29.29",
    "dbt-duckdb==1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "shop_analytics"
