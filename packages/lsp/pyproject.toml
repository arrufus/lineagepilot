[project]
name = "lineagepilot-lsp"
dynamic = ["version"]
description = "LineagePilot language server: CodeLens, hover, diagnostics and lineage/* requests over lineagepilot_core, on stdio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lineagepilot-core",
    # S1 finding 4 and the params converter in server.py are written against pygls 2.1
    "pygls>=2.1,<2.2",
    "lsprotocol>=2025.0.0",
]

[tool.uv.sources]
lineagepilot-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    # 7.10 added patch = ["subprocess"], which measures the server and its indexer
    "coverage>=7.10",
    "pytest-cov>=5",
    "pytest-lsp>=1.0",
    "ruff>=0.6",
]
# Kept out of `dev` so the auditor and its dependencies are not part of what it audits.
audit = ["pip-audit>=2.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lineagepilot_lsp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagepilot_lsp"]

[tool.uv]
# The Homebrew Pythons on the development machine are x86_64 builds under Rosetta.
python-preference = "only-managed"
# Resolve only releases at least two weeks old, as packages/core does.
exclude-newer = "2026-10-19T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=lineagepilot_lsp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["lineagepilot_lsp"]
# The end-to-end tests run the server, and the server runs its indexer, as subprocesses
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]
